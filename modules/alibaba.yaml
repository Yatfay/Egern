      policy: REJECT
      disabled: {{{TB_OFF}}}
  # ---- 闲鱼 ----
  - domain_keyword:
      match: iyes.youku.com
      policy: REJECT
      disabled: {{{XY_OFF}}}
  # 闲鱼 amdc 分发接口：仅当 User-Agent 为闲鱼时拦截（fmz200 XianYu.sgmodule）
  - and:
      match:
        - url_regex:
            match: '^http://.+\/amdc\/mobileDispatch'
        - user_agent:
            match: '*闲鱼*'
