# 阿里系去广告
# ============
# 淘宝 / 天猫 / 支付宝 / 闲鱼 去广告与净化
#
# 来源（合并细节、冲突裁决、舍弃项见同目录 alibaba.report.md）：
#   - fmz200/wool_scripts：Alibaba.sgmodule、Taobao.sgmodule、XianYu.sgmodule、
#     myBlockAds.js、xianyu_ads.js、eleme.js、alipayAdBlock（小程序合集）
#   - zirawell/R-Store：taobao.sgmodule、goofish.sgmodule、alipay.sgmodule、
#     taobao.js、goofish.js、eleme.js
#   - ishowshu/qx：goofish.js（2026-10-24，闲鱼最新最全脚本）
#   - I-am-R-E/Functional-Store-Hub：无上述四款应用的原生 Egern 模块
#
# 天猫说明：未找到天猫专属去广告规则；天猫与淘宝共用 mtop 网关
# （acs.m.taobao.com / guide-acs.m.taobao.com）与阿里妈妈广告域，
# 本模块的淘宝规则同样覆盖天猫。
#
# 注意：部分规则（开屏、首页信息流）需清缓存或重装 App 才生效；
# 闲鱼首页过滤较激进（只保留 cardTypeValue == "Item" 的卡片）。
#
# 分 App 总开关（2026-11-27 新增）
# ---------------------------
# 三个开关，默认均为 false（= 该 App 去广告开启，保持原有行为）：
#   TB_OFF  关闭淘宝/天猫去广告
#   ZFB_OFF 关闭支付宝去广告（含支付宝内哈啰出行 / 饿了么小程序条目）
#   XY_OFF  关闭闲鱼去广告
# 机制：Egern 模块参数替换（configuration-modules.md “参数替换”）——文件在解析前
# 对每个 {{{参数名}}} 占位符做全文替换，替换值为 compat_arguments 的值；disabled
# 是布尔字段，故占位符不加引号，替换后解析为真正的布尔值（文档示例：enabled: {{{FLAG}}}）。
# disabled 字段见官方文档：rules（configuration-rules.md）、url_rewrites
# （configuration-url_rewrites.md）、body_rewrites（含 response_jq /
# response_regex，configuration-body_rewrites.md）；map_locals 无独立文档页，
# 示例文档只列 match / status_code / headers / body，disabled 是按其余四类
# 条目统一模式推断的，未经官方文档证实，需真机验证。
# 为什么开关名和标签是反的：disabled 取“启用”开关的反值；若做成“淘宝去广告”
# 开关，界面上 ON 反而代表整组停用，会误导。改用“关闭XX去广告”：OFF = 正常
# 去广告，ON = 该 App 的全部条目停用。本模块无 scripts，无需改动。
# 注意：
# - MITM hostnames 是模块级的，开关关不掉：关闭某 App 开关只是让该 App 的
#   条目停止改写/拦截，MITM 拦截本身仍在，流量原样通过、不做修改。
# - 天猫无专属规则，与淘宝共享 mtop / 阿里妈妈条目，故共用 TB_OFF 一个开关。
# - 阿里妈妈 180x180 占位图（mdn.alicdn.com）是淘宝/天猫广告链路的一部分，
#   归 TB_OFF；闲鱼、支付宝小程序条目按注释/来源归属划分，不重复、不拆分。

name: 阿里系去广告
description: 淘宝 / 天猫 / 支付宝 / 闲鱼去广告与净化；部分规则需清缓存或重装 App 才生效；各 App 去广告可单独开关（默认全开）
author: 奶思, zirawell, 树先生
homepage: https://github.com/Yatfay/Egern
icon: https://raw.githubusercontent.com/zirawell/R-Store/main/Res/Icon/App/taobao.png

# 分 App 总开关：false = 该 App 去广告开启（默认）；true = 关闭该 App 的全部条目
compat_arguments:
  TB_OFF: false
  ZFB_OFF: false
  XY_OFF: false

env_schema:
  TB_OFF:
    name: "关闭淘宝/天猫去广告"
    options:
      - "true"
      - "false"
    default_value: "false"
  ZFB_OFF:
    name: "关闭支付宝去广告"
    options:
      - "true"
      - "false"
    default_value: "false"
  XY_OFF:
    name: "关闭闲鱼去广告"
    options:
      - "true"
      - "false"
    default_value: "false"

