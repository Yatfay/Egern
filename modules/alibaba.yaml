      match: abapi.hellobike.com
      policy: REJECT
      disabled: {{{ZFB_OFF}}}
  - domain:
      match: apmgw.hellobike.com
      policy: REJECT
      disabled: {{{ZFB_OFF}}}
  - domain:
      match: cdn.hellobike.com
      policy: REJECT
      disabled: {{{ZFB_OFF}}}
  - domain:
      match: ip.hellobike.com
      policy: REJECT
      disabled: {{{ZFB_OFF}}}

url_rewrites:
  # ---- 淘宝 / 天猫：开屏与广告配置接口 ----
  # 冲突裁决：fmz200 用 map-local（2026-11-11），R-Store 用 reject（2026-05-09）；
  # 开屏类接口按 fail-closed 取 reject（详见 alibaba.report.md）
  - match: '^https?:\/\/acs\.m\.taobao\.com\/gw\/mtop\.etao\.noah\.query\/.+tao_splash'
    location: http://reject/
    disabled: {{{TB_OFF}}}
  - match: '^https?:\/\/acs\.m\.taobao\.com\/gw\/mtop\.alimama\.etao\.config\.query\/.+?etao_advertise'
    location: http://reject/
    disabled: {{{TB_OFF}}}
  # ---- 闲鱼 ----
  - match: '^https?:\/\/acs\.m\.goofish\.com\/gw\/mtop\.taobao\.idle\.playboy\.recommend\/1\.0'
    location: http://reject/
    disabled: {{{XY_OFF}}}
  - match: '^https?:\/\/h5\.m\.goofish\.com\/app\/idleFish-F2e\/idlefish-pop'
    location: http://reject/
    disabled: {{{XY_OFF}}}
  - match: '^https?:\/\/dinamicx\.alibabausercontent\.com\/pub\/fish_home_top_kingkong_new\/'
    location: http://reject/
    disabled: {{{XY_OFF}}}
  - match: '^https?:\/\/g\.alicdn\.com\/IdleFish-F2e\/idlefish-workers\/[0-9.]+\/smartLoader'
    location: http://reject/
    disabled: {{{XY_OFF}}}
  # ---- 支付宝小程序：哈啰 / 饿了么 ----
  - match: '^https?:\/\/api\.hellobike\.com\/api\?msg\.toast\.user'
    location: http://reject/
    disabled: {{{ZFB_OFF}}}
  - match: '^https?:\/\/api\.hellobike\.com\/api\?homepage\.shortcut\.scene\.perception'
    location: http://reject/
    disabled: {{{ZFB_OFF}}}
  - match: '^https?:\/\/api\.hellobike\.com\/api\?homepage\.module\.newAlipay'
    location: http://reject/
    disabled: {{{ZFB_OFF}}}
  - match: '^https?:\/\/api\.hellobike\.com\/api\?bottom\.aggregation\.tab\.info'
    location: http://reject/
    disabled: {{{ZFB_OFF}}}
  - match: '^https?:\/\/api\.hellobike\.com\/api\?homepage\.recommend\.popUp'
    location: http://reject/
    disabled: {{{ZFB_OFF}}}
  - match: '^https?:\/\/waimai-guide\.ele\.me\/h5\/mtop\.alsc\.interact\.content\.homepage\.float'
    location: http://reject/
    disabled: {{{ZFB_OFF}}}
  - match: '^https?:\/\/waimai-guide\.ele\.me\/(gw|h5)\/mtop\.alsc\.eleme\.trigger\.respond'
    location: http://reject/
    disabled: {{{ZFB_OFF}}}
  # 阿里妈妈 180x180 占位图：map-local 无法表达二进制小图，改用 reject-img
  - match: '^https?:\/\/mdn\.alicdn\.com\/imgextra\/i1\/.*-tps-180-180\.gif$'
    location: http://reject-img/
    disabled: {{{TB_OFF}}}

body_rewrites:
  # ================= 淘宝 =================
  # 云视频广告：时长归零、资源与缓存清空、响应时间推到 2090 年
  - response_jq:
      match: '^https?:\/\/guide-acs\.m\.taobao\.com\/gw\/mtop\.taobao\.cloudvideo\.video\.query'
      disabled: {{{TB_OFF}}}
      filter: >-
        .data.duration = "0" | .data.resources = [] | .data.caches = [] | .data.respTimeInMs = "3818332800000"
  # 开屏广告：把 taobao-splash 的投放时间窗推到 2090 年并清空图片/视频
  - response_jq:
      match: '^https?:\/\/guide-acs\.m\.taobao\.com\/gw\/mtop\.taobao\.wireless\.home\.splash\.awesome\.get'
      disabled: {{{TB_OFF}}}
      filter: >-
        if .data.containers.splash_home_base.base.sections then
          .data.containers.splash_home_base.base.sections |= map(
            if (.bizData // {}) | has("taobao-splash") then
              if (.bizData["taobao-splash"].data | type) == "array" then
                .bizData["taobao-splash"].data |= map(
                  .waitTime = "0" | .times = "0" | .hotStart = "false" | .haveVoice = "false"
                  | .hideTBLogo = "false" | .enable4G = "false" | .coldStart = "false"
                  | .startTime = "3818332800000" | .endTime = "3818419199000"
                  | .gmtStart = "2090-12-31 00:00:00" | .gmtEnd = "2090-12-31 23:59:59"
                  | .gmtStartMs = "3818332800000" | .gmtEndMs = "3818419199000"
                  | .imgUrl = "" | .videoUrl = ""
                )
              else . end
            else . end
          )
        else . end
  # 弹窗模板：清空图片/视频并禁用
  - response_jq:
      match: '^https?:\/\/poplayer\.template\.alibaba\.com\/\w+\.json'
      disabled: {{{TB_OFF}}}
      filter: >-
        .res.images = [] | .res.videos = [] | .enable = false | .mainRes.images = []
  # ================= 闲鱼 =================
  # 首页信息流：只保留 cardTypeValue == "Item" 的卡片（最激进的过滤）
  - response_jq:
      match: '^https?:\/\/(g-)?acs\.m\.goofish\.com\/gw\/mtop\.taobao\.idlehome\.home\.nextfresh\/'
      disabled: {{{XY_OFF}}}
      filter: >-
        del(.data.widgetReturnDO, .data.bannerReturnDO)
        | if .data then
            .data.homeTopList = []
            | if .data.sections then
                .data.sections |= map(select(
                  (.data.bizType != "AD" and .data.bizType != "homepage")
                  and (.template.name != "fish_home_yunying_card_d3"
                    and .template.name != "idlefish_seafood_market"
                    and .template.name != "fish_home_chat_room")
                  and .data.cardTypeValue == "Item"
                ))
              else . end
          else . end
  # 同城首页：过滤广告卡片
  - response_jq:
      match: '^https?:\/\/(g-)?acs\.m\.goofish\.com\/gw\/mtop\.taobao\.idle\.local\.home\/'
      disabled: {{{XY_OFF}}}
      filter: >-
        if .data.sections then
          .data.sections |= map(select(.data.bizType != "AD"))
        else . end
  # 首页鲸鱼模块：整体移除
  - response_jq:
      match: '^https?:\/\/(g-)?acs\.m\.goofish\.com\/gw\/mtop\.taobao\.idle\.home\.whale\.modulet\/'
      disabled: {{{XY_OFF}}}
      filter: >-
        del(.data.container.sections)
  # 我的页：只保留第 0、1、3 个模块，清空 ability
  - response_jq:
      match: '^https?:\/\/acs\.m\.goofish\.com\/gw\/mtop\.idle\.user\.page\.my\.adapter\/'
      disabled: {{{XY_OFF}}}
      filter: >-
        if .data.container.sections then
          .data.container.sections |= map(select(.index == "0" or .index == "1" or .index == "3"))
        else . end
        | if .data then .data.ability = [] else . end
  # 鱼塘列表：只保留 circleId 1、2；头部只保留 main / recycle，recycle 的右标清空
  - response_jq:
      match: '^https?:\/\/(g-)?acs\.m\.goofish\.com\/gw\/mtop\.taobao\.idlehome\.home\.circle\.list\/1\.0'
      disabled: {{{XY_OFF}}}
      filter: >-
        if .data.circleList then
          .data.circleList |= map(select(.circleId == "1" or .circleId == "2"))
        else . end
        | if .data.next.headList then
            .data.next.headList |= map(select(.bizCode == "main" or .bizCode == "recycle")
              | if .bizCode == "recycle" then .showInfo.rightTagImage = {} else . end)
          else . end
        | if .data.headList then
            .data.headList |= map(select(.bizCode == "main" or .bizCode == "recycle")
              | if .bizCode == "recycle" then .showInfo.rightTagImage = {} else . end)
          else . end
  # 搜索页：过滤阿里妈妈广告与运营卡片，删除顶部横条与 topList
  - response_jq:
      match: '^https?:\/\/g-acs\.m\.goofish\.com\/gw\/mtop\.taobao\.idlemtopsearch\.search\/'
      disabled: {{{XY_OFF}}}
      filter: >-
        if .data.resultList then
          .data.resultList |= map(select(
            (.data.item.main.exContent.isAliMaMaAD as $ad | ($ad != true and $ad != "true"))
            and .data.template.name != "idlefish_search_card_category_select"
            and .data.template.name != "idlefish_search_spu_market_publish"
          ))
        else . end
        | del(.data.resultPrefixBar)
        | if .data then .data.topList = [] else . end
  # 我的鱼塘横幅：清空
  - response_jq:
      match: '^https?:\/\/acs\.m\.goofish\.com\/gw\/mtop\.taobao\.idle\.group\.myself\.banner\/'
      disabled: {{{XY_OFF}}}
      filter: >-
        .data.bannerList = []
  # 玩转推荐 2.0：清空推荐与 next
  - response_jq:
      match: '^https?:\/\/acs\.m\.goofish\.com\/gw\/mtop\.taobao\.idle\.playboy\.recommend\/2\.0'
      disabled: {{{XY_OFF}}}
      filter: >-
        .data.recommends = [] | .data.items = [] | .data.next = false
  # 商品推荐列表：清空
  - response_jq:
      match: '^https?:\/\/acs\.m\.goofish\.com\/gw\/mtop\.taobao\.idle\.item\.recommend\.list\/'
      disabled: {{{XY_OFF}}}
      filter: >-
        .data.cardList = []
  # 附近商品详情入口：清空跳转与名称描述
  - response_jq:
      match: '^https?:\/\/acs\.m\.goofish\.com\/gw\/mtop\.taobao\.idle\.local\.nearby\.itemdetail\.enter\/1\.0'
      disabled: {{{XY_OFF}}}
      filter: >-
        .data.targetUrl = "" | .data.trackParams.itemIds = "" | .data.nearbyItemInfoList = []
        | .data.name = "" | .data.desc = "" | .data.poiName = ""
  # 消息会话同步：移除 sessionType 25 的会话
  - response_jq:
      match: '^https?:\/\/acs\.m\.goofish\.com\/gw\/mtop\.taobao\.idlemessage\.session\.sync\/3\.0'
      disabled: {{{XY_OFF}}}
      filter: >-
        if .data.sessions then
          .data.sessions |= map(select(.session.sessionType != "25"))
        else . end
  # 关注动态：只保留 cardType 9999，清空副标题
  - response_jq:
      match: '^https?:\/\/acs\.m\.goofish\.com\/gw\/mtop\.taobao\.idle\.fun\.follow\.feed\.list'
      disabled: {{{XY_OFF}}}
      filter: >-
        if .data.sections then
          .data.sections |= map(select(.cardType == 9999)
            | if .cardData.subText then .cardData.subText = "" else . end)
        else . end
  # 常逛鱼塘：清空
  - response_jq:
      match: '^https?:\/\/acs\.m\.goofish\.com\/gw\/mtop\.taobao\.idle\.fun\.follow\.often\.visit'
      disabled: {{{XY_OFF}}}
      filter: >-
        .data.sections = []
  # 鱼塘我的页横幅：清空
  - response_jq:
      match: '^https?:\/\/acs\.m\.goofish\.com\/gw\/mtop\.taobao\.idle\.circle\.myself\.banner\/1\.0'
      disabled: {{{XY_OFF}}}
      filter: >-
        .data.bannerList = []
  # 逛过的鱼塘：清空
  - response_jq:
      match: '^https?:\/\/acs\.m\.goofish\.com\/gw\/mtop\.taobao\.idle\.circle\.visited\/1\.0'
      disabled: {{{XY_OFF}}}
      filter: >-
        .data.visitedCircleList = []
  # 关注推荐：清空解密键与下一页
  - response_jq:
      match: '^https?:\/\/acs\.m\.goofish\.com\/gw\/mtop\.taobao\.follow\.recommend\.feed\.list'
      disabled: {{{XY_OFF}}}
      filter: >-
        .data.needDecryptKeys = [] | .data.nextPage = false | .data.fitRecommendAB = true
  # 同城信息流组件：移除活动入口卡片
  - response_jq:
