      match: h-adashx.ut.taobao.com
      policy: REJECT
      disabled: {{{TB_OFF}}}
  - domain_suffix:
      match: w.m.taobao.com
      policy: REJECT
      disabled: {{{TB_OFF}}}
  - domain_suffix:
      match: re.m.taobao.com
      policy: REJECT
      disabled: {{{TB_OFF}}}
  - domain_suffix:
      match: agoodm.m.taobao.com
      policy: REJECT
      disabled: {{{TB_OFF}}}
  - domain_suffix:
      match: ai.taobao.com
      policy: REJECT
      disabled: {{{TB_OFF}}}
  - domain_suffix:
