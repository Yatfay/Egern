name: 京东系去广告
description: 京东、京东金融、京东特价版（京喜）去广告：开屏、首页/我的/订单/物流页推广楼层与弹窗；适配京东 15.9.50+ 新协议（响应体 base64 化）。部分规则需清缓存或重装 App 才生效。各 App 去广告可单独开关，默认全开。
author: zbsdsb, zirawell, 奶思
homepage: https://github.com/Yatfay/Egern
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/JD.png
compat_arguments:
  JD_OFF: false
  JDJR_OFF: false
  JX_OFF: false

env_schema:
  JD_OFF:
    name: "关闭京东去广告"
    options:
      - "true"
      - "false"
    default_value: "false"
  JDJR_OFF:
    name: "关闭京东金融去广告"
    options:
      - "true"
      - "false"
    default_value: "false"
  JX_OFF:
    name: "关闭京喜去广告"
    options:
      - "true"
      - "false"
    default_value: "false"

# 合并来源（一行一个）：
# - zbsdsb/loon-adblock-plugins JD_remove_ads_v2.js @2026-08-12：核心脚本，适配 15.9.50+ base64 新协议（基于 RuCu6 / Maasea / kelee 原插件）
# - zirawell/R-Store @2026-05-20：规则、readCustomSurfaceList、京东金融、京东特价版（京喜）
# - fmz200/wool_scripts @2026-11-11：规则（奶思）、京东金融开屏与广告接口
# - QingRex/LoonKissSurge @2025-05-13：京东去广告（RuCu6, Maasea）
# - huangkouping/egern @2026-11-02：Egern 原生适配参考（jd-adblock.yaml）
# - Tartarus2014/Loon-Script @2026-08-12：京东去广告 v2 插件封装
# 冲突处理：
# - welcomeHome 首页楼层：R-Store 白名单 vs zbsdsb/fmz200 黑名单 → 采用黑名单（最新两源一致；白名单会隐藏新楼层类型）
# - start 开屏：脚本 images=[] 与 map-local/reject-img 冲突 → 采用 url_rewrite reject-dict（最新 Egern 源）+ 脚本兜底
# - getWidgetV1052 直播小窗：被 zirawell 的 getWidget 通配覆盖 → 删重复项
# - searchBoxWord 等：map-local 与 reject-200 同义 → 采用 map-local（带状态与响应体，更具体）
# - (bdsp-x|dsp-x)/adx、京东金融开屏图、adInfo、getLaunchImageList：同上，map-local 优先
# - queryMaterialAdverts：zirawell 用空文本 map-local，huangkouping 用空 JSON → 采用 reject-dict（JSON 接口返回 {} 更安全）
# - uniformRecommend：QingRex 覆盖 [06]，zirawell 覆盖 7 → 合并为 [067]
# - getLoadingPicture：fmz200 单条被 zirawell 的 aladdin 分组覆盖 → 删重复项
# - jddebug diagnose URL 规则：已被 DOMAIN-SUFFIX jddebug.com 规则覆盖 → 删重复项
# - basicConfig 的 socketmonitor/httpdns 改写（QingRex）：非广告，改动联网行为 → 丢弃
# - blackmatrix7 京东开屏（hd.mina.mi.com）：小米端开屏接口，与京东 App 主接口无关 → 丢弃
# - 京东签到/cookie 脚本（jd_cookie.js）：非去广告 → 丢弃
# - 京东健康/读书/云无线宝：不在本次范围 → 未收录
# - huangkouping 的 rewrites/respond 字段：egern-docs 未收录该字段 → 改用等价的 url_rewrites reject-dict
# - 京东外卖去广告（QingRex）：独立 mini 服务，不在本模块范围 → 未收录

# ---- 各 App 去广告总开关（2026-11-27 新增）----
# 开关一览（默认全部 false = 全部开启，与改动前行为一致）：
# - JD_OFF   关闭京东 App 去广告
# - JDJR_OFF 关闭京东金融去广告
# - JX_OFF   关闭京喜（京东特价版）去广告
# 机制：每个条目带 disabled: {{{KEY}}}；Egern 在模块解析时做参数替换
# （configuration-modules.md “参数替换”：每个 {{{参数名}}} 占位符都会被替换；
# 布尔字段不加引号，文档示例即 `enabled: {{{FLAG}}}`），替换后 disabled 解析为真布尔值。
# disabled 字段文档依据：rules（configuration-rules.md）、url_rewrites
# （configuration-url_rewrites.md）、map_locals（见下）、scriptings
# （configuration-scriptings.md）——其中 map_locals 的 disabled 未见于文档
# （configuration-example.md 的 map_locals 示例只列 match/status_code/headers/body），
# 是按其余四类条目统一模式推断的，需真机验证，见 toggles/jd-meituan.report.md。
# 为什么开关名是“关闭XX”而不是“开启XX”：disabled 取的是启用开关的反值；
# 若做成“京东去广告”ON 开关，开关显示 ON 时实际是 disabled=true（已关闭），
# 方向完全颠倒；故参数本身就是 DISABLE 标志，标签如实写“关闭XX去广告”。
# 注意：mitm hostnames 是模块级配置，不随开关变化；关闭某 App 只是让该 App 的
# 条目全部失效（不再改写/拦截），MITM 拦截本身仍会放行流量（原样通过，不修改）。
# 原始文件未动；脚本 jd.js 未改（scriptings 条目由 disabled 在配置层关闭）。
