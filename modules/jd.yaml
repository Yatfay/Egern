url_rewrites:
  # 开屏与广告素材接口：返回空 JSON（huangkouping @2026-11-02；脚本同时兜底）
  - match: '^https?://api\.m\.jd\.(com|hk)/client\.action\?(?:[^&]+&)*functionId=(?:start|queryMaterialAdverts)(?:&|$)'
    location: http://reject-dict/
    disabled: {{{JD_OFF}}}
  # 屏蔽强制更新（zirawell @2026-05-20）
  - match: '^https?://api\.m\.jd\.com/openUpgrade'
    location: http://reject/
    disabled: {{{JD_OFF}}}
  - match: '^https?://api\.m\.jd\.com/api/appPublishUpgrade'
    location: http://reject/
    disabled: {{{JD_OFF}}}
  # 首页/购物车推广素材（zirawell @2026-05-20）
  - match: '^https?://storage\.360buyimg\.com/app\.m\.jd\.com/lottie'
    location: http://reject/
    disabled: {{{JD_OFF}}}
  - match: '^https?://storage\.360buyimg\.com/dynamicConfig/binary'
    location: http://reject/
    disabled: {{{JD_OFF}}}
  - match: '^https?://storage\.360buyimg\.com/occupy-home/'
    location: http://reject/
    disabled: {{{JD_OFF}}}
  - match: '^https?://storage\.360buyimg\.com/xview'
    location: http://reject/
    disabled: {{{JD_OFF}}}
  - match: '^https?://storage\.360buyimg\.com/appcartsoa/client/cart_egg_entry'
    location: http://reject/
    disabled: {{{JD_OFF}}}
  - match: '^https?://img\d+\.360buyimg\.com/jddjadvertise/'
    location: http://reject/
    disabled: {{{JD_OFF}}}
  - match: '^https?://storage\.jd\.com/ti-pythontask/JD/jdt_'
    location: http://reject/
    disabled: {{{JD_OFF}}}
  - match: '^https?://storage\.jd\.com/mpaas2-public/product/\d+/'
    location: http://reject/
    disabled: {{{JD_OFF}}}
  # 京喜（京东特价版）广告接口（zirawell @2025-07-22）
  - match: '^https?://api\.m\.jd\.com/client\.action\?functionId=lite_advertising'
    location: http://reject/
    disabled: {{{JX_OFF}}}
  # 京东金融首页/开屏（zirawell @2026-05-09，分组覆盖 fmz200 的单条 getLoadingPicture）
  - match: '^https?://ms\.jr\.jd\.com/gw/generic/aladdin/(?:new)?na/m/(?:getLoadingPicture|getPageMutilDataForHomePage|getTopCard|getBottomNavigation)'
    location: http://reject/
    disabled: {{{JDJR_OFF}}}
  # 京东金融第三方广告 SDK（fmz200 @2026-11-11）
  - match: '^https?://appconf\.mail\.163\.com/mmad/'
    location: http://reject/
    disabled: {{{JDJR_OFF}}}
  - match: '^https?://support\.you\.163\.com/xhr/boot/getBootMedia\.json'
    location: http://reject/
    disabled: {{{JDJR_OFF}}}

map_locals:
  # 广告配置接口：返回空文本 200（zirawell @2026-05-20；QingRex 的 uniformRecommend[06] 已合并为 [067]）
  - match: '^https?://api\.m\.jd\.com/client\.action\?functionId=(?:searchBoxWord|xview2Config|stationPullService|getWidget|widget|hybrid|jdDiscoveryRedPoint|apollo_style|jdaPreDownload|uniformRecommend[067])'
    status_code: 200
    headers:
      Content-Type: text/plain
    body: ''
    disabled: {{{JD_OFF}}}
  # 广告交易平台（fmz200 + zirawell 一致）
  - match: '^https?://(?:bdsp-x|dsp-x)\.jd\.com/adx/'
    status_code: 200
    headers:
      Content-Type: text/plain
    body: ''
    disabled: {{{JD_OFF}}}
  # 京东金融开屏图（fmz200 + zirawell 一致）
  - match: '^https?://m\.360buyimg\.com/mobilecms/s1125x2436_jfs/'
    status_code: 200
    headers:
      Content-Type: text/plain
    body: ''
    disabled: {{{JDJR_OFF}}}
  # 京东金融广告信息（zirawell @2026-05-09）
  - match: '^https?://ms\.jr\.jd\.com/gw/generic/base/(?:new)?na/m/adInfo'
    status_code: 200
    headers:
      Content-Type: text/plain
    body: ''
    disabled: {{{JDJR_OFF}}}
  # 京东金融开屏图列表：返回空 JSON（zirawell @2026-05-09）
  - match: '^https?://ms\.jr\.jd\.com/gw/generic/app/(?:new)?na/m/getLaunchImageList'
    status_code: 200
    headers:
      Content-Type: application/json
    body: '{}'
    disabled: {{{JDJR_OFF}}}

scriptings:
  - http_response:
      name: 京东去广告
      match: '^https?://api\.m\.jd\.(com|hk)/client\.action'
      script_url: https://raw.githubusercontent.com/Yatfay/Egern/main/scripts/jd.js
      disabled: {{{JD_OFF}}}
      body_required: true
      max_size: 2097152

mitm:
  hostnames:
    - api.m.jd.com
    - api.m.jd.hk
    - '*.360buyimg.com'
    - storage.jd.com
    - ms.jr.jd.com
    - appconf.mail.163.com
    - support.you.163.com
    - bdsp-x.jd.com
    - dsp-x.jd.com
