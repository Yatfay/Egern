# 网易云音乐去广告（Yu9191 版）
# 来源：Yu9191/NeteasemusicAd@2026-11-25（wyy.lpx + src/ 未压缩源码，作者 Yu9191）
# 与仓库内 Keywos 版 netease-music.yaml 是两个独立模块：本模块的开关更多
# （底部 Tab 增加关注/搜索、顶部 Tab、自定义 Tab 名称、首页新增私房推荐/红心相似），
# 两个模块不要同时启用（显示名相同，脚本会重复处理同一批接口）。
# 转换说明：
# - 4 条 DOMAIN 规则 → 嵌套式 rules（domain 精确匹配 + REJECT）
# - 8 条 Loon reject_dict(200) → url_rewrites（location: http://reject-dict/）
# - 9 条 http-response 脚本入口共用一个 Egern 原生脚本（scripts/netease-music-yu9191.js），
#   由 src/ 未压缩源码按 Egern ctx API 重写；eapi 响应 AES-128-ECB 加密，脚本不可省
# - 全部参数（开关/文本/下拉）见下方 compat_arguments 与 env_schema；
#   底部 Tab 开关 = 隐藏（true 隐藏），顶部 Tab 与首页卡片开关 = 显示（true 显示）
# 剔除（原插件有、此处不要）：
# - 设置页（wyy-settings 请求入口 + 侧边栏“去广告设置”入口注入）：BoxJS 式应用内
#   设置页，Egern 没有等价机制；全部设置项改由 env_schema 提供（顺序串与提示文字也在内）
# - 假 VIP 解锁（vip.mjs）：源码中未接入路由的死代码，且引用不存在的 function/vip.mjs；
#   属于解锁而非去广告
# - 歌曲播放菜单 songMore：路由表里有但 .lpx 没有对应脚本入口，从不触发，死代码
# - 关注列表 FOLLOW_TIP 提示（“这人没关注你哦”）按原样保留（默认开启，可用开关关闭）；
#   注意它不是去广告，Keywos 版模块有意略去了同类功能
# 说明：
# - 仅在合成数据上验证过，未在真机实测；需清除缓存或重装 App 才生效
name: 网易云音乐去广告
description: 去除广告与推广位，自定义底部/顶部 Tab 与首页卡片；Yu9191 2026-11-25 版；需清除缓存或重装 App 才生效。
author: Yu9191
homepage: https://github.com/Yu9191/NeteasemusicAd
icon: https://raw.githubusercontent.com/Keywos/rule/main/tv/app/144px/Netease.png

# 底部 Tab 开关（true = 隐藏）与自定义名称，默认与 .lpx [Argument] 一致
# Egern 做法：compat_arguments 用布尔值声明；env_schema 用 options ["true","false"] 生成开关
compat_arguments:
  FX: false
  MY: true
  DT: false
  GZ: true
  SOU: true
  SY_NAME: ""
  WD_NAME: ""
  MY_NAME: ""
  DT_NAME: ""
  FX_NAME: ""
  SOU_NAME: ""
  XD: true
  YY: false
  BK: false
  TS: false
  HDTAB: false
  XD_NAME: ""
  TJ_NAME: ""
  YY_NAME: ""
  BK_NAME: ""
  TS_NAME: ""
  BOTTOM_ORDER: ""
  TOP_ORDER: ""
  FOLLOW_TIP: true
  FOLLOW_TEXT: ""
  PRGG: false
  PRDRD: false
  PRSCVPT: false
  PRST: false
  HMPR: false
  PRRR: true
  PRRK: false
  PRMST: false
  PRCN: true
  PRPRS: true
  PRRSS: true
  LogLevel: "info"

env_schema:
  FX:
    name: "[底部 Tab]隐藏发现"
    description: 开启即隐藏该标签
    options:
      - "true"
      - "false"
    default_value: "false"
  MY:
    name: "[底部 Tab]隐藏漫游"
    description: 开启即隐藏该标签
    options:
      - "true"
      - "false"
    default_value: "true"
  DT:
    name: "[底部 Tab]隐藏笔记"
    description: 开启即隐藏该标签
    options:
      - "true"
      - "false"
    default_value: "false"
  GZ:
    name: "[底部 Tab]隐藏关注"
    description: 开启即隐藏该标签
    options:
      - "true"
      - "false"
    default_value: "true"
  SOU:
    name: "[底部 Tab]隐藏搜索"
    description: 开启即隐藏该标签
    options:
      - "true"
      - "false"
    default_value: "true"
  SY_NAME:
    name: "[底部 Tab]首页自定义名称"
    description: 留空保持原名
    default_value: ""
  WD_NAME:
    name: "[底部 Tab]我的自定义名称"
    description: 留空保持原名
    default_value: ""
  MY_NAME:
    name: "[底部 Tab]漫游自定义名称"
    description: 留空保持原名
    default_value: ""
  DT_NAME:
    name: "[底部 Tab]笔记自定义名称"
    description: 留空保持原名
    default_value: ""
  FX_NAME:
    name: "[底部 Tab]发现自定义名称"
    description: 留空保持原名
    default_value: ""
  SOU_NAME:
    name: "[底部 Tab]搜索自定义名称"
    description: 留空保持原名
    default_value: ""
  XD:
    name: "[顶部 Tab]显示心动"
    description: 开启即显示
    options:
      - "true"
      - "false"
    default_value: "true"
  YY:
    name: "[顶部 Tab]显示音乐"
    description: 开启即显示
    options:
      - "true"
      - "false"
    default_value: "false"
  BK:
    name: "[顶部 Tab]显示播客"
    description: 开启即显示
    options:
      - "true"
      - "false"
    default_value: "false"
  TS:
    name: "[顶部 Tab]显示听书"
    description: 开启即显示
    options:
      - "true"
      - "false"
    default_value: "false"
  HDTAB:
    name: "[顶部 Tab]显示活动 Tab"
    description: 开启即显示
    options:
      - "true"
      - "false"
    default_value: "false"
  XD_NAME:
    name: "[顶部 Tab]心动自定义名称"
    description: 留空保持原名
    default_value: ""
  TJ_NAME:
    name: "[顶部 Tab]推荐自定义名称"
    description: 留空保持原名
    default_value: ""
  YY_NAME:
    name: "[顶部 Tab]音乐自定义名称"
    description: 留空保持原名
    default_value: ""
  BK_NAME:
    name: "[顶部 Tab]播客自定义名称"
    description: 留空保持原名
    default_value: ""
  TS_NAME:
    name: "[顶部 Tab]听书自定义名称"
    description: 留空保持原名
    default_value: ""
  BOTTOM_ORDER:
    name: "[底部 Tab]顺序"
    description: "逗号分隔，如：首页,搜索,笔记,我的；留空保持原顺序"
    default_value: ""
  TOP_ORDER:
    name: "[顶部 Tab]顺序"
    description: "逗号分隔，如：fastPlay,rcmd,music,podcast,vBook；留空保持原顺序"
    default_value: ""
  FOLLOW_TIP:
    name: "[关注列表]显示「没关注你」提示"
    description: 开启后，没回关你的人会显示提示
    options:
      - "true"
      - "false"
    default_value: "true"
