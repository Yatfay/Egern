  LogLevel:
    name: "[调试]日志级别"
    description: 排错时切到 debug
    options:
      - "off"
      - "error"
      - "warn"
      - "info"
      - "debug"
      - "all"
    default_value: "info"

rules:
  - domain:
      match: iadmat.nosdn.127.net
      policy: REJECT
  - domain:
      match: iadmatapk.nosdn.127.net
      policy: REJECT
  - domain:
      match: iadmusicmat.music.126.net
      policy: REJECT
  - domain:
      match: iadmusicmatvideo.music.126.net
      policy: REJECT

url_rewrites:
  # 广告接口
  - match: "^https?://(ipv4|interface\\d?)\\.music\\.163\\.com/x?e?api/ad"
    location: "http://reject-dict/"
  - match: "^https?://interface\\d?\\.music\\.163\\.com/[wx]?e?api/(?:side-bar/mini-program/music-service/account|delivery/(batch-deliver|deliver)|moment/tab/info/get|yunbei/account/entrance/get)"
    location: "http://reject-dict/"
  - match: "^https?://music\\.163\\.com/x?eapi/delivery/(batch-deliver|deliver)"
    location: "http://reject-dict/"
  - match: "^https?://interface\\d?\\.music\\.163\\.com/x?eapi/(?:resource/comments?/musiciansaid|community/friends/fans-group/artist/group/get|user/sub/artist|music/songshare/text/recommend/get|mine/applet/redpoint|resniche/position/play/new/get)"
    location: "http://reject-dict/"
  - match: "^https?://interface\\d?\\.music\\.163\\.com/[wx]?e?api/search/default"
    location: "http://reject-dict/"
  - match: "^https?://interface\\d?\\.music\\.163\\.com/[wx]?e?api/(?:search/(chart|rcmd/keyword|specialkeyword)|resource-exposure/|activity/bonus/playpage/time/query)"
    location: "http://reject-dict/"
  - match: "^https?://interface\\d?\\.music\\.163\\.com/x?eapi/(?:mlivestream/entrance/playpage|link/(position/show/strategy|scene/show)|ios/version|v\\d/content/exposure/comment/banner)"
    location: "http://reject-dict/"
  - match: "^https?://interface\\d?\\.music\\.163\\.com/store/x?e?api/(webconfig|entryconfig)"
    location: "http://reject-dict/"

scriptings:
  - http_response:
      name: 网易云音乐去广告
      match: "^https?://((ipv4|interface\\d?)\\.)?music\\.163\\.com/x?e?api/(batch|v\\d/resource/comment/floor/get|v1/user/info|resource/comments/reply/preload|comment/feed/inserted/resources/combined|sp/flow/popup/query|link/home/framework/tab|link/home/framework/top/tab|homepage/block/page|link/page/rcmd/(resource/show|block/resource/multi/refresh)|link/page/discovery/resource/show|link/position/show/resource|user/follow/users/mixed/get|vipactivity/app/cashier/setting/get)"
      script_url: "https://raw.githubusercontent.com/Yatfay/Egern/main/scripts/netease-music-yu9191.js"
      body_required: true
      binary_body: true
      timeout: 20
      env:
        FX: "{{{FX}}}"
        MY: "{{{MY}}}"
        DT: "{{{DT}}}"
        GZ: "{{{GZ}}}"
        SOU: "{{{SOU}}}"
        SY_NAME: "{{{SY_NAME}}}"
        WD_NAME: "{{{WD_NAME}}}"
        MY_NAME: "{{{MY_NAME}}}"
        DT_NAME: "{{{DT_NAME}}}"
        FX_NAME: "{{{FX_NAME}}}"
        SOU_NAME: "{{{SOU_NAME}}}"
        XD: "{{{XD}}}"
        YY: "{{{YY}}}"
        BK: "{{{BK}}}"
        TS: "{{{TS}}}"
        HDTAB: "{{{HDTAB}}}"
        XD_NAME: "{{{XD_NAME}}}"
        TJ_NAME: "{{{TJ_NAME}}}"
        YY_NAME: "{{{YY_NAME}}}"
        BK_NAME: "{{{BK_NAME}}}"
        TS_NAME: "{{{TS_NAME}}}"
        BOTTOM_ORDER: "{{{BOTTOM_ORDER}}}"
        TOP_ORDER: "{{{TOP_ORDER}}}"
        FOLLOW_TIP: "{{{FOLLOW_TIP}}}"
        FOLLOW_TEXT: "{{{FOLLOW_TEXT}}}"
        PRGG: "{{{PRGG}}}"
        PRDRD: "{{{PRDRD}}}"
        PRSCVPT: "{{{PRSCVPT}}}"
        PRST: "{{{PRST}}}"
        HMPR: "{{{HMPR}}}"
        PRRR: "{{{PRRR}}}"
        PRRK: "{{{PRRK}}}"
        PRMST: "{{{PRMST}}}"
        PRCN: "{{{PRCN}}}"
        PRPRS: "{{{PRPRS}}}"
        PRRSS: "{{{PRRSS}}}"
        LogLevel: "{{{LogLevel}}}"

