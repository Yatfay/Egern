      - "true"
      - "false"
    default_value: "false"
  PRRR:
    name: "[首页]雷达歌单"
    description: 开启即显示
    options:
      - "true"
      - "false"
    default_value: "true"
  PRRK:
    name: "[首页]排行榜"
    description: 开启即显示
    options:
      - "true"
      - "false"
    default_value: "false"
  PRMST:
    name: "[首页]推荐专属歌单"
    description: 开启即显示
    options:
      - "true"
      - "false"
    default_value: "false"
  PRCN:
    name: "[首页]你的专属歌单"
    description: 开启即显示
    options:
      - "true"
      - "false"
    default_value: "true"
  PRPRS:
    name: "[首页]私房推荐歌曲"
    description: 开启即显示
    options:
      - "true"
      - "false"
    default_value: "true"
  PRRSS:
    name: "[首页]红心相似歌曲"
