  # ---- 广告图片：返回 1px 透明图 ----
  - match: '^https?:\/\/img\.meituan\.net\/(adunion|display|midas)\/.+\.(gif|jpg)\.webp$'
    location: http://reject-img/
  - match: '^https?:\/\/img\.meituan\.net\/groceryimages\/\w+\.gif'
    location: http://reject-img/
  - match: '^https?:\/\/img\.meituan\.net\/groceryimages\/\w+\.png@220w_220h_1e_1l'
    location: http://reject-img/
  - match: '^https?:\/\/p\d\.meituan\.net\/movie\/.+?\.jpg\?may_covertWebp'
    location: http://reject-img/
  - match: '^https?:\/\/p\d\.meituan\.net\/travelcube\/(?!1d4a663|52e9bfc|29a6227|412c4ac|6ee35c4|13bf0bf|ab8692e|6858b1d).+@100w_100h'
    location: http://reject-img/
  - match: '^https?:\/\/p\d\.meituan\.net\/(\d+\.\d+\.\d+\/)?wmbanner\/(?!fb51b9d|4e9d3c4).+\.gif'
    location: http://reject-img/
  - match: '^https?:\/\/(s3plus|flowplus)\.meituan\.net\/v\d\/\w+\/linglong\/.+\.(?:gif|jpg|mp4)'
    location: http://reject-img/
  - match: '^https?:\/\/img\.meituan\.net\/bizad\/bizad_brandCpt_\d+\.jpg'
    location: http://reject-img/
  - match: '^https?:\/\/img\.meituan\.net\/goodsawardpic\/[a-f0-9]+\.png\.webp'
    location: http://reject-img/
  - match: '^https?:\/\/img\.meituan\.net\/goodsawardpic\/\w+\.gif'
    location: http://reject-img/
  - match: '^https?:\/\/s3plus\.meituan\.net\/v\d\/mss_\w+\/goku\/(?:lottie|lucency)'
    location: http://reject-img/
  - match: '^https?:\/\/p\d\.meituan\.net\/nrpresourcevenus\/\w+\.gif'
    location: http://reject-img/
  - match: '^https?:\/\/p\d\.meituan\.net\/travelcube\/(?!c129a661)\w+\.gif'
    location: http://reject-img/
  # ---- 返回空 JSON ----
  - match: '^http:\/\/59\.82\.113\.10\/amdc\/mobileDispatch\?appkey=213807&'
    location: http://reject-dict/
  - match: '^https?:\/\/portal-portm\.meituan\.com\/horn_ios'
    location: http://reject-dict/
  - match: '^https?:\/\/mall\.meituan\.com\/api\/c\/homepage\/splash'
    location: http://reject-dict/
  - match: '^https?:\/\/cdb\.meituan\.com\/marketing\/source\/getPageSlotList'
    location: http://reject-dict/
  - match: '^https?:\/\/npay\.meituan\.com\/conch\/flow\/mypage-wallet-info'
    location: http://reject-dict/
  - match: '^https?:\/\/npay\.meituan\.com\/conch\/walletv\d\/wechat-pop-window'
    location: http://reject-dict/
  - match: '^https?:\/\/web\.meituan\.com\/newUser\/returnMoney\/popWindow'
    location: http://reject-dict/
  - match: '^https?:\/\/web\.meituan\.com\/api\/miniprogram\/my\/(?:novelZone|resources)'
    location: http://reject-dict/
  # ---- 美团众包：开屏图返回空 200 ----
  - match: '^https?:\/\/peisongapi\.meituan\.com\/client\/getInitiateImage'
    location: http://reject-200/

body_rewrites:
  # 微信小程序美团外卖：底部栏只留 首页/神券/我的；对象响应时删一分购入口
  - response_jq:
      match: '^https?:\/\/web\.meituan\.com\/api\/miniprogram\/(tabbar\/all\/query|index\/aggregate)'
      filter: 'if (.data | type) == "array" then .data |= map(select(type == "object" and (.name == "首页" or .name == "神券" or .name == "我的"))) elif (.data | type) == "object" then del(.data.oneCentBuy) else . end'
  # 美团订单详情：关掉合作方状态位（fmz200 2024-02-22 的旧条目，已加存在性保护，未在现版本验证）
  - response_jq:
      match: '^https?:\/\/ordercenter\.meituan\.com\/ordercenter\/user\/showOrderDetail'
      filter: 'if .data?.partnerData then .data.partnerData.poiStatus = 0 else . end'
  # 大众点评 Picasso 卡片：把 WedgetCard 改名使其失效
  - response_regex:
      match: '^https?:\/\/ddplus\.meituan\.net\/v\d\/mss_\w+\/picassovc'
      find: 'function WedgetCard'
      replace: 'function WedgetCard0'

map_locals:
  # 大众点评智能首页 / 微信广告查询：返回空 JSON
  - match: '^https?:\/\/mapi\.dianping\.com\/mapi\/intelliindex'
    status_code: 200
    headers: {Content-Type: application/json}
    body: '{}'
  - match: '^https?:\/\/rms\.meituan\.com\/api\/v\d\/rmsmina\/c\/queryWechatAdvertisement'
    status_code: 200
    headers: {Content-Type: application/json}
    body: '{}'
  # 小象超市首页领券悬浮红包：返回 code 0（无数据）
  - match: '^https?:\/\/mall\.meituan\.com\/api\/c\/homepage\/bubble\/operate\/info'
    status_code: 200
    headers: {Content-Type: application/json}
    body: '{"code": 0}'

scriptings:
  # 美团 linglong 图片：按请求头与尺寸判断广告图（见 scripts/meituan.js）
  - http_response:
      name: 美团灵珑图片
      match: '^https?:\/\/p\d\.meituan\.net\/linglong\/'
      script_url: 'https://raw.githubusercontent.com/Yatfay/Egern/main/scripts/meituan.js'
      body_required: true
      binary_body: true
      timeout: 20
      max_size: 10485760
  # 大众点评图片：按请求头判断广告请求，可用 DP_SCRIPT 开关关闭
  - http_response:
      name: 大众点评图片
      match: '^https?:\/\/img\.meituan\.net\/(dpmobile|goodsawardpic)\/'
      script_url: 'https://raw.githubusercontent.com/Yatfay/Egern/main/scripts/meituan.js'
      body_required: true
      binary_body: true
      timeout: 20
      max_size: 10485760
      env:
        DP_SCRIPT: '{{{DP_SCRIPT}}}'

