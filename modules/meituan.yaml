body_rewrites:
  # 微信小程序美团外卖：底部栏只留 首页/神券/我的；对象响应时删一分购入口
  - response_jq:
      match: '^https?:\/\/web\.meituan\.com\/api\/miniprogram\/(tabbar\/all\/query|index\/aggregate)'
      filter: 'if (.data | type) == "array" then .data |= map(select(type == "object" and (.name == "首页" or .name == "神券" or .name == "我的"))) elif (.data | type) == "object" then del(.data.oneCentBuy) else . end'
      disabled: {{{WM_OFF}}}
  # 美团订单详情：关掉合作方状态位（fmz200 2024-02-22 的旧条目，已加存在性保护，未在现版本验证）
  - response_jq:
      match: '^https?:\/\/ordercenter\.meituan\.com\/ordercenter\/user\/showOrderDetail'
      filter: 'if .data?.partnerData then .data.partnerData.poiStatus = 0 else . end'
      disabled: {{{MT_OFF}}}
  # 大众点评 Picasso 卡片：把 WedgetCard 改名使其失效
  - response_regex:
      match: '^https?:\/\/ddplus\.meituan\.net\/v\d\/mss_\w+\/picassovc'
      find: 'function WedgetCard'
      replace: 'function WedgetCard0'
      disabled: {{{DP_OFF}}}

map_locals:
  # 大众点评智能首页 / 微信广告查询：返回空 JSON
  - match: '^https?:\/\/mapi\.dianping\.com\/mapi\/intelliindex'
    status_code: 200
    headers: {Content-Type: application/json}
    body: '{}'
    disabled: {{{DP_OFF}}}
  - match: '^https?:\/\/rms\.meituan\.com\/api\/v\d\/rmsmina\/c\/queryWechatAdvertisement'
    status_code: 200
    headers: {Content-Type: application/json}
    body: '{}'
    disabled: {{{MT_OFF}}}
  # 小象超市首页领券悬浮红包：返回 code 0（无数据）
  - match: '^https?:\/\/mall\.meituan\.com\/api\/c\/homepage\/bubble\/operate\/info'
    status_code: 200
    headers: {Content-Type: application/json}
    body: '{"code": 0}'
    disabled: {{{XX_OFF}}}

scriptings:
  # 美团 linglong 图片：按请求头与尺寸判断广告图（见 scripts/meituan.js）
  - http_response:
      name: 美团灵珑图片
      match: '^https?:\/\/p\d\.meituan\.net\/linglong\/'
      script_url: 'https://raw.githubusercontent.com/Yatfay/Egern/main/scripts/meituan.js'
      disabled: {{{MT_OFF}}}
      body_required: true
      binary_body: true
      timeout: 20
      max_size: 10485760
  # 大众点评图片：按请求头判断广告请求，可用 DP_OFF 总开关关闭（Ad-Cleaner 新版逻辑，只看 m-shark-traceid）
  - http_response:
      name: 大众点评图片
      match: '^https?:\/\/img\.meituan\.net\/dpmobile\/'
      script_url: 'https://raw.githubusercontent.com/Yatfay/Egern/main/scripts/meituan.js'
      disabled: {{{DP_OFF}}}
      body_required: true
