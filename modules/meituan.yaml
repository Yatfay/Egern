# 美团系去广告
# 合并来源（各取最新）：
# - fmz200/wool_scripts@2026-11-11（Loon，作者 奶思）：美团、美团 & 美团外卖、大众点评、小象超市、美团充电宝小程序、美团众包
# - zirawell/R-Store@2026-08-31（Surge/QX，作者 zirawell）：美团、美团外卖、大众点评、美团众包、美团充电宝（微信小程序）
# - zirawell/R-Store Res/Scripts/AntiAd/meituan.js、dianping.js、meituanwm.js（作者 zirawell；meituanwm.js 另注出处 ZenmoFeiShi/Qx）
# - fmz200/wool_scripts Scripts/meituan/meituan_ads.js@2024-02-22（作者 fmz200）：订单详情 poiStatus
# - I-am-R-E/Functional-Store-Hub 与 leiyiyan/resource 无美团系去广告模块，未采用
# 冲突处理：
# - Loon reject(404) 与 QX/Surge reject 是同一意图，统一用 url_rewrite http://reject/
# - Loon reject_dict(200) 与 QX reject-dict 同意；intelliindex 与 queryWechatAdvertisement 按 Surge 的 map-local（置空 JSON + 200）处理
# - wmapi 开屏接口：Loon 只写 v7，Surge 写 v\d+，取较宽的 v\d+（拒绝类规则 fail-closed）
# - s3plus blk_conf：Loon 只写 blk_conf_73.json，QX/Surge 写 blk_conf 前缀，取较宽的 blk_conf
# - portal-portm horn_ios：Loon 只写 mergeRequest，QX 写整个 /horn_ios，取较宽的 /horn_ios
# - s3plus brandcpt-vedio/waimai-alita zip：Loon 用 reject-dict，QX/Surge 用 reject；以后者为准（zip 用 reject 更干净，Loon 条目已被 QX 的 v\d 覆盖）
# - flowplus.meituan.net 整站 REJECT（R-Store Surge/过滤列表）未采用：与按路径拦截 linglong 广告图冲突，整站拒绝可能误伤该 CDN 上的正常图片；只保留路径级 reject-img
# - report.meituan.com（Loon 的 domain_suffix）被 R-Store 的 domain_keyword report.meituan 覆盖，合并且只留 keyword
# 剔除（原来源有、此处不要）：
# - fmz200 meituanV3.js：青龙/Node.js 定时领券脚本，要填用户 token，不是去广告，不可移植
# - 美团单车：来源里无独立的美团单车模块（只有滴滴/ ofo /永安行等别家单车），其 App 内广告由美团 App 条目覆盖
# - 柠季（leiyiyan/resource ningji.js）：pos.meituan.com 的 Token 脚本，与去广告无关
# 脚本说明：
# - scripts/meituan.js 合并了 zirawell 的 meituan.js（linglong 图片）与 dianping.js（大众点评图片）；
#   ddplus picassovc 的字符串替换已降为 response_regex，不在脚本里
# - meituan.js 原脚本里 @1sc 会员图保护判断写在带 $ 锚点的正则分支内、实际永不触发；移植时提到分支前才生效（见脚本注释）
name: 美团系去广告
description: 去除美团、美团外卖、大众点评、小象超市、美团充电宝与美团众包的开屏、信息流与推广广告；某些 App 需清除缓存或重装才生效。
author: 奶思, zirawell
homepage: https://github.com/Yatfay/Egern
icon: https://raw.githubusercontent.com/zirawell/R-Store/main/Res/Icon/App/meituan.png

# 大众点评脚本开关（来自 Loon [Argument] davsdmpk_enable；true = 启用）
compat_arguments:
  DP_SCRIPT: true

env_schema:
  DP_SCRIPT:
    name: "大众点评-脚本开关"
    options:
      - "true"
      - "false"
    default_value: "true"

rules:
  # ---- 美团：广告 / 统计 / 日志 / HTTPDNS ----
  - domain_suffix:
      match: meituan.xn
      policy: REJECT
  - domain_suffix:
      match: meituan.yoga
      policy: REJECT
  - domain_suffix:
      match: meituangov.cn
      policy: REJECT
  - domain_suffix:
      match: analytics.meituan.net
      policy: REJECT
  - domain_suffix:
      match: wmlog.meituan.com
      policy: REJECT
  - domain_suffix:
      match: ad.e.waimai.sankuai.com
      policy: REJECT
  - domain_suffix:
      match: mads.meituan.com
      policy: REJECT
  - domain_suffix:
      match: dreport.meituan.net
      policy: REJECT
  - domain_suffix:
      match: d.meituan.net
      policy: REJECT
  - domain:
      match: hlx.meituan.com
      policy: REJECT
  - domain:
      match: layout.meituan.net
      policy: REJECT
  - domain:
      match: httpdnsmultiapi.meituan.com
      policy: REJECT
  - domain:
      match: httpdnsmultiapivip.meituan.com
      policy: REJECT
  - domain_suffix:
      match: httpdns.meituan.com
      policy: REJECT
  - domain_keyword:
      match: report.meituan
      policy: REJECT
  - domain_keyword:
      match: dnspod.meituan.httpdns
      policy: REJECT
  - ip_cidr:
      match: 103.37.155.60/32
      policy: REJECT
      no_resolve: true
  # ---- 大众点评 ----
  - domain:
      match: r.dianping.com
      policy: REJECT
  - domain:
      match: tte.meituan.com
      policy: REJECT
  - domain:
      match: lx0.meituan.com
      policy: REJECT
  - domain:
      match: dxlvs.meituan.com
      policy: REJECT
  - domain:
      match: dpmtpush.dianping.com
      policy: REJECT
  - domain:
      match: dynamicf.sankuai.com
      policy: REJECT
  - domain:
      match: live-monitor-broker.sankuai.com
      policy: REJECT
  - domain_suffix:
      match: lx.meituan.net
      policy: REJECT
  - ip_cidr:
      match: 101.32.16.204/32
      policy: REJECT
      no_resolve: true
  - ip_cidr:
      match: 103.63.160.80/32
      policy: REJECT
      no_resolve: true
  - ip_cidr:
      match: 119.29.126.137/32
      policy: REJECT
      no_resolve: true

url_rewrites:
  # ---- 美团 App ----
  - match: '^https?:\/\/apimobile\.meituan\.com\/appupdate'
    location: http://reject/
  - match: '^https?:\/\/apimobile\.meituan\.com\/group\/v\d\/recommend\/unity\/recommends'
    location: http://reject/
  - match: '^https?:\/\/p\d\.meituan\.net\/(display|mmc)\/'
    location: http://reject/
  - match: '^https?:\/\/www\.meituan\.com\/api\/v\d\/appstatus\?'
    location: http://reject/
  - match: '^https?:\/\/s3plus\.meituan\.net\/v\d\/mss_\w+\/waimai-alita\/\w+\.zip$'
    location: http://reject/
  - match: '^https?:\/\/s3plus\.meituan\.net\/v\d\/mss_\w+\/brandcpt'
    location: http://reject/
  - match: '^https?:\/\/w\.meituan\.net\/v\d\/mss_\w+\/waimai-mach\/\d+\/\d+\/pt-im-(?:guider|coupon-card-stateful)'
    location: http://reject/
  - match: '^https?:\/\/sqt\.meituan\.com\/s\/gateway\/mweb\/api\/marketingResource\/show'
    location: http://reject/
  # ---- 美团外卖 ----
  - match: '^https?:\/\/wmapi\.meituan\.com\/api\/v\d+\/(?:loadInfo|openscreen|startpicture)'
    location: http://reject/
  - match: '^https?:\/\/p\d\.meituan\.net\/cell'
    location: http://reject/
  # ---- 大众点评 ----
  - match: '^https?:\/\/103\.37\.155\.60\/fetch'
    location: http://reject/
  - match: '^https?:\/\/catdot\.dianping\.com\/broker-service\/hijack'
    location: http://reject/
  - match: '^https?:\/\/mapi\.dianping\.com\/mapi\/operating\/(?:indexopsmodules|loadsplashconfig)'
    location: http://reject/
  - match: '^https?:\/\/mapi\.dianping\.com\/wdrpreload\/userprediction'
    location: http://reject/
  - match: '^https?:\/\/mapi\.dianping\.com\/adshopping'
    location: http://reject/
  - match: '^https?:\/\/p\.meituan\.com\/api\/privacy\/config'
    location: http://reject/
  - match: '^https?:\/\/www\.dpfile\.com\/app\/fecommonservice-lottie\/ugc-write-done\/media'
    location: http://reject/
  - match: '^https?:\/\/www\.dpfile\.com\/picasso\/picasso-qa\/src\/AnswerList\/AnswerList-bundle'
    location: http://reject/
  - match: '^https?:\/\/www\.dpfile\.com\/sc\/indexpromotion'
    location: http://reject/
  - match: '^https?:\/\/catfront\.dianping\.com\/api\/metric\?v=\d&p=rn_gcbu_mrn-joy-poidetail'
    location: http://reject/
  - match: '^https?:\/\/awp-assets\.meituan\.net\/hfe\/fep\/\w+\.json'
    location: http://reject/
  - match: '^https?:\/\/s3plus\.meituan\.net\/ocean-blk-index\/index\/blk_conf'
    location: http://reject/
  - match: '^https?:\/\/ddplus\.meituan\.net\/v\d\/mss_\w+\/(?:ehc|titansx|ddblue|edfu)\/'
