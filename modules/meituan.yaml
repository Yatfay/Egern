# 美团系去广告
# 合并来源（各取最新）：
# - fmz200/wool_scripts@2026-11-11（Loon，作者 奶思）：美团、美团 & 美团外卖、大众点评、小象超市、美团充电宝小程序、美团众包
# - zirawell/R-Store@2026-08-31（Surge/QX，作者 zirawell）：美团、美团外卖、大众点评、美团众包、美团充电宝（微信小程序）
# - zirawell/R-Store Res/Scripts/AntiAd/meituan.js、dianping.js、meituanwm.js（作者 zirawell；meituanwm.js 另注出处 ZenmoFeiShi/Qx）
# - zirawell/Ad-Cleaner（同作者的新版仓库）：大众点评 dianPing.conf 与 Collection/js/dianping.js
#   （2026-11-21 修订：大众点评图片脚本改用 Ad-Cleaner 新版逻辑——只看 m-shark-traceid，返回 204；
#   goodsawardpic 改整路径 reject-img；新增 mars.meituan.com/locate 拦截与 ddplus mmp；
#   开屏接口 loadsplashconfig 与信息流 intelliindex 与新版来源一致，仍有开屏广告多半是 App 缓存未清）
# - fmz200/wool_scripts Scripts/meituan/meituan_ads.js@2024-02-22（作者 fmz200）：订单详情 poiStatus
# - I-am-R-E/Functional-Store-Hub 与 leiyiyan/resource 无美团系去广告模块，未采用
# 冲突处理：
# - Loon reject(404) 与 QX/Surge reject 是同一意图，统一用 url_rewrite http://reject/
# - Loon reject_dict(200) 与 QX reject-dict 同意；intelliindex 与 queryWechatAdvertisement 按 Surge 的 map-local（置空 JSON + 200）处理
# - wmapi 开屏接口：Loon 只写 v7，Surge 写 v\d+，取较宽的 v\d+（拒绝类规则 fail-closed）
# - s3plus blk_conf：Loon 只写 blk_conf_73.json，QX/Surge 写 blk_conf 前缀，取较宽的 blk_conf
# - portal-portm horn_ios：Loon 只写 mergeRequest，QX 写整个 /horn_ios，取较宽的 /horn_ios
# - s3plus brandcpt-vedio/waimai-alita zip：Loon 用 reject-dict，QX/Surge 用 reject；以后者为准（zip 用 reject 更干净，Loon 条目已被 QX 的 v\d 覆盖）
# - flowplus.meituan.net 整站 REJECT（R-Store Surge/过滤列表）未采用：与按路径拦截 linglong 广告图冲突，整站拒绝可能误伤该 CDN 上的正常图片；只保留路径级 reject-img
# - report.meituan.com（Loon 的 domain_suffix）被 R-Store 的 domain_keyword report.meituan 覆盖，合并且只留 keyword
# 剔除（原来源有、此处不要）：
# - fmz200 meituanV3.js：青龙/Node.js 定时领券脚本，要填用户 token，不是去广告，不可移植
# - 美团单车：来源里无独立的美团单车模块（只有滴滴/ ofo /永安行等别家单车），其 App 内广告由美团 App 条目覆盖
# - 柠季（leiyiyan/resource ningji.js）：pos.meituan.com 的 Token 脚本，与去广告无关
# 脚本说明：
# - scripts/meituan.js 合并了 zirawell 的 meituan.js（linglong 图片）与 dianping.js（大众点评图片）；
#   ddplus picassovc 的字符串替换已降为 response_regex，不在脚本里
# - meituan.js 原脚本里 @1sc 会员图保护判断写在带 $ 锚点的正则分支内、实际永不触发；移植时提到分支前才生效（见脚本注释）
# ---- 各 App 去广告总开关（2026-11-27 新增）----
# 开关一览（默认全部 false = 全部开启，与改动前行为一致）：
# - MT_OFF  关闭美团 App 去广告
# - WM_OFF  关闭美团外卖去广告
# - DP_OFF  关闭大众点评去广告（总开关；原 DP_SCRIPT 脚本开关已于 2026-11-27 并入此开关）
# - XX_OFF  关闭小象超市去广告
# - CDB_OFF 关闭美团充电宝去广告
# - ZB_OFF  关闭美团众包去广告
# 机制：每个条目带 disabled: {{{KEY}}}；Egern 在模块解析时做参数替换
# （configuration-modules.md “参数替换”：每个 {{{参数名}}} 占位符都会被替换；
# 布尔字段不加引号，文档示例即 `enabled: {{{FLAG}}}`），替换后 disabled 解析为真布尔值。
# disabled 字段文档依据：rules（configuration-rules.md）、url_rewrites
# （configuration-url_rewrites.md）、body_rewrites（configuration-body_rewrites.md，
# response_jq / response_regex 均有 disabled）、map_locals（见下）、scriptings
# （configuration-scriptings.md）——其中 map_locals 的 disabled 未见于文档
# （configuration-example.md 的 map_locals 示例只列 match/status_code/headers/body），
# 是按其余四类条目统一模式推断的，需真机验证，见 toggles/jd-meituan.report.md。
# 为什么开关名是“关闭XX”而不是“开启XX”：disabled 取的是启用开关的反值；
# 若做成“美团去广告”ON 开关，开关显示 ON 时实际是 disabled=true（已关闭），
# 方向完全颠倒；故参数本身就是 DISABLE 标志，标签如实写“关闭XX去广告”。
# DP_SCRIPT（原有，大众点评-脚本开关，默认 true）已于 2026-11-27 并入 DP_OFF：脚本里的
# DP_SCRIPT 判断已删除，大众点评图片脚本现在只要条目启用就处理；DP_OFF 在配置层禁用
# 全部大众点评条目（含该 scripting 条目本身及所有规则/重写），一个开关管全部。
# 注意：mitm hostnames 是模块级配置，不随开关变化；关闭某 App 只是让该 App 的
# 条目全部失效（不再改写/拦截），MITM 拦截本身仍会放行流量（原样通过，不修改）。
# 2026-11-27：DP_SCRIPT 并入 DP_OFF，脚本 meituan.js 同步删除 DP_SCRIPT 判断。
name: 美团系去广告
description: 去除美团、美团外卖、大众点评、小象超市、美团充电宝与美团众包的开屏、信息流与推广广告；某些 App 需清除缓存或重装才生效。各 App 去广告可单独开关，默认全开。
author: 奶思, zirawell
homepage: https://github.com/Yatfay/Egern
icon: https://raw.githubusercontent.com/zirawell/R-Store/main/Res/Icon/App/meituan.png

# 大众点评脚本开关（来自 Loon [Argument] davsdmpk_enable；true = 启用）
# 2026-11-27：已并入 DP_OFF 总开关，此处删除。
compat_arguments:
  MT_OFF: false
  WM_OFF: false
  DP_OFF: false
  XX_OFF: false
  CDB_OFF: false
  ZB_OFF: false

env_schema:
  MT_OFF:
    name: "关闭美团去广告"
    options:
      - "true"
      - "false"
    default_value: "false"
  WM_OFF:
    name: "关闭美团外卖去广告"
    options:
      - "true"
      - "false"
    default_value: "false"
  DP_OFF:
    name: "关闭大众点评去广告"
    options:
      - "true"
      - "false"
    default_value: "false"
  XX_OFF:
    name: "关闭小象超市去广告"
    options:
      - "true"
      - "false"
    default_value: "false"
  CDB_OFF:
    name: "关闭美团充电宝去广告"
    options:
      - "true"
      - "false"
    default_value: "false"
  ZB_OFF:
    name: "关闭美团众包去广告"
    options:
      - "true"
      - "false"
    default_value: "false"

